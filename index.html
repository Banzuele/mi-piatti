<!doctype html>
<html lang="it" data-versione="v9">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mi-Piatti</title>
  <meta name="description" content="Menù settimanale e lista della spesa condivisi per la famiglia.">
  <meta name="theme-color" content="#2f6b4f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icona.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/icona-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Mi-Piatti">
  <link rel="stylesheet" href="css/stile.css">
</head>
<body>
  <div id="intro" class="intro" role="status" aria-live="polite">
    <svg class="intro-icona" viewBox="0 0 512 512" aria-hidden="true">
      <rect width="512" height="512" rx="112" fill="#2f6b4f"/>
      <circle cx="197.3" cy="279.0" r="108.9" fill="#1d4532" opacity=".55"/>
      <circle cx="354.8" cy="152.3" r="76.2" fill="#1d4532" opacity=".55"/>
      <circle cx="327.3" cy="393.6" r="52.6" fill="#1d4532" opacity=".55"/>
      <g class="piatto" style="animation-duration:1.4s">
        <circle cx="192.9" cy="270.3" r="102.4" fill="#275c43" stroke="#fff" stroke-width="13.1"/>
        <circle cx="192.9" cy="270.3" r="65.4" fill="none" stroke="#fff" stroke-width="6.5" opacity=".85"/>
        <circle cx="192.9" cy="270.3" r="81.9" fill="none" stroke="#fff" stroke-width="7.2" stroke-linecap="round" stroke-dasharray="72.1 514.7" opacity=".7"/>
      </g>
      <g class="piatto" style="animation-duration:1.1s;animation-direction:reverse">
        <circle cx="351.7" cy="146.2" r="71.7" fill="#275c43" stroke="#fff" stroke-width="9.1"/>
        <circle cx="351.7" cy="146.2" r="45.7" fill="none" stroke="#fff" stroke-width="4.6" opacity=".85"/>
        <circle cx="351.7" cy="146.2" r="57.4" fill="none" stroke="#fff" stroke-width="5.0" stroke-linecap="round" stroke-dasharray="50.5 360.4" opacity=".7"/>
      </g>
      <g class="piatto" style="animation-duration:0.9s">
        <circle cx="325.2" cy="389.4" r="49.5" fill="#275c43" stroke="#fff" stroke-width="6.3"/>
        <circle cx="325.2" cy="389.4" r="31.6" fill="none" stroke="#fff" stroke-width="3.2" opacity=".85"/>
        <circle cx="325.2" cy="389.4" r="39.6" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="34.8 248.8" opacity=".7"/>
      </g>
    </svg>
    <p class="intro-nome">Mi-Piatti</p>
    <p class="intro-stato" id="intro-stato">Cerco aggiornamenti…</p>
    <small class="intro-versione" id="intro-versione"></small>
  </div>

  <header class="testata">
    <h1>Mi-Piatti</h1>
    <span id="stato-sync" class="stato-sync"></span>
  </header>

  <main id="contenuto" class="contenuto">
    <p class="vuoto">Caricamento…</p>
  </main>

  <nav class="schede" id="schede">
    <button data-scheda="menu" class="attiva"><span class="ico">🍽️</span>Menù</button>
    <button data-scheda="spesa"><span class="ico">🛒</span>Spesa</button>
    <button data-scheda="ricette"><span class="ico">📖</span>Ricette</button>
    <button data-scheda="altro"><span class="ico">⚙️</span>Altro</button>
  </nav>

  <div id="modale" class="modale" hidden></div>
  <div id="avviso" class="avviso" hidden></div>

  <script src="js/intro.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
